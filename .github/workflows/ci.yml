name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install
      - run: pnpm --filter @me/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @me/ui exec playwright install chromium
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test

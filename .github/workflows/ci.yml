name: CI

on:
  push:
  pull_request:

# Least privilege. Without this the token inherits the repo default, which on
# an older repo can still be read-write — meaning any transitive package's
# install script would run with write access to a public repo. This workflow
# consumes no secrets and deploys nothing (Vercel handles that on its own),
# so read is all it ever needs.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install
      - run: pnpm --filter @me/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @me/ui exec playwright install chromium
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test
      # Without this a green CI never proved the site actually builds.
      - run: pnpm build
